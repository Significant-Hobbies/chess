name: Docs

# Validates the docs/ knowledge system with a dependency-free link check.
on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'STATUS.md'
      - 'README.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/check-docs-links.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'STATUS.md'
      - 'README.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/check-docs-links.sh'
      - '.github/workflows/docs.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fast local link check (no network)
        run: ./scripts/check-docs-links.sh
